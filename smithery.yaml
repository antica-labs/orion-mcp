# Smithery.ai MCP Server Configuration — ORION Finance
startCommand:
  type: http
  url: https://www.orion-finance.eu/api/mcp
  configSchema:
    type: object
    properties:
      bearerToken:
        type: string
        title: OAuth 2.1 / API Bearer Token
        description: Obtain via OAuth 2.1 PKCE (https://www.orion-finance.eu/.well-known/oauth-authorization-server) or workspace settings.
